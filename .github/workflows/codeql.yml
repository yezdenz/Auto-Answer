name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
