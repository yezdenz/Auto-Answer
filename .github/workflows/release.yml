name: Release Windows App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/verify_release_version.py "${{ github.ref_name }}"

      - name: Security and test gates
        run: |
          python scripts/check_secrets.py --history
          python -m pip_audit -r requirements.txt
          python -m compileall -q main.py src tests
          python -m unittest discover -s tests -v

      - name: Build Windows application
        run: pyinstaller --clean --noconfirm packaging/Endependenz.spec

      - name: Package application and checksum
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          }
          Copy-Item README.md, SECURITY.md, LICENSE, config.example.json -Destination dist/Endependenz
          New-Item -ItemType Directory -Force release | Out-Null
          $archive = "release/Endependenz-$version-Windows-x64.zip"
          $sbom = "release/Endependenz-$version-sbom.cdx.json"
          Compress-Archive -Path dist/Endependenz -DestinationPath $archive -CompressionLevel Optimal
          python -m pip_audit -r requirements.txt --format cyclonedx-json --output $sbom
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  Endependenz-$version-Windows-x64.zip" | Set-Content -Encoding ascii "$archive.sha256"
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM=$archive.sha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SBOM=$sbom" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Endependenz-Windows-x64
          path: |
            ${{ env.RELEASE_ARCHIVE }}
            ${{ env.RELEASE_CHECKSUM }}
            ${{ env.RELEASE_SBOM }}
          if-no-files-found: error

      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.RELEASE_ARCHIVE }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "${{ env.RELEASE_ARCHIVE }}"
          "${{ env.RELEASE_CHECKSUM }}"
          "${{ env.RELEASE_SBOM }}"
          --verify-tag
          --generate-notes
          --title "Endependenz ${{ github.ref_name }}"
